name: Docs checks

# Rules for this file are in AGENTS.md ("GitHub Actions"):
# least-privilege permissions, actions pinned to a full commit SHA,
# no pull_request_target, untrusted values passed through env.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 06:17 UTC: catches external links that have gone stale.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  internal-links:
    name: Internal links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --offline checks only links between files in the repository, so
          # this job cannot fail because someone else's website is down.
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true

  prd-ids:
    name: PRD requirement IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -I keeps the script's folder, which a pull request controls, off
      # Python's import path.
      - run: python3 -I scripts/check_prd_ids.py

  registry:
    name: Registry matches the PRD
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Test 12 of the PRD: its fixed lists (event types, hold reasons,
      # refusals, check results) equal api/contract/registry.json. -I keeps
      # the script's folder, which a pull request controls, off Python's
      # import path.
      - name: Compare the PRD's fixed lists with the registry
        run: python3 -I scripts/check_registry.py
      - name: Self-test of the registry check
        run: python3 -I scripts/test_check_registry.py

  rules:
    name: Rules compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request this checks out the merge commit. Its first
          # parent (HEAD^1) is the base branch, which is where the script
          # reads the rule list from, so two commits of history are enough.
          fetch-depth: 2
      # The description and author are read from the event file, not passed
      # through the environment: a description can be longer than one
      # environment variable may be. Each script runs with -I, which keeps
      # its folder, which a pull request controls, off Python's import path.
      - name: Check the pull request against the architecture rules
        if: github.event_name == 'pull_request'
        run: python3 -I scripts/check_rules.py --base 'HEAD^1' --event "$GITHUB_EVENT_PATH"
      - name: Check the repository against the architecture rules
        if: github.event_name != 'pull_request'
        run: python3 -I scripts/check_rules.py
      - name: Self-test of the rules check
        run: python3 -I scripts/test_check_rules.py

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check that the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|revert)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: title follows Conventional Commits."
          else
            echo "::error::The pull request title must follow Conventional Commits, for example 'docs: fix a broken link'."
            echo "Allowed types: feat, fix, docs, chore, refactor, test, build, ci, perf, style, revert."
            echo "See https://www.conventionalcommits.org/"
            exit 1
          fi

  external-links:
    name: External links
    # Not run on pull requests or pushes: a third-party outage must never
    # block a merge. Runs weekly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --accept '200..=299,429' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
