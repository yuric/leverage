name: CI

# Rules for this file are in AGENTS.md ("GitHub Actions"):
# least-privilege permissions, actions pinned to a full commit SHA,
# no pull_request_target, untrusted values passed through env.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketing:
    name: Marketing page tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/test_marketing_demo.mjs
      - run: bash scripts/test_deploy_marketing_page.sh

  subscription-preview:
    name: Subscription preview tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test docs/subscription/preview/mock-billing.test.cjs

  api:
    name: API tests and RuboCop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same containers as on the owner's Mac (compose.yaml): the API
      # image built from api/Dockerfile, and the PostgreSQL service the tests
      # run against. A copy of the example alone must start nothing: its
      # secrets are empty. The values made after that never leave this job.
      - name: Check that the example alone starts nothing
        run: |
          cp .env.example .env
          if docker compose config --quiet 2>/dev/null; then
            echo "compose accepted .env.example unchanged" >&2
            exit 1
          fi
          rm .env
      - name: Make the configuration
        run: python3 -I scripts/make_env.py
      - name: Build the API image
        run: docker compose build
      - name: Run the API tests against PostgreSQL
        run: docker compose run --rm api bin/rails test
      # An empty database migrated from zero must dump exactly the committed
      # db/structure.sql, which the tests load: the migrations and the
      # schema file cannot drift apart. The diff runs in the container,
      # against the copy of the file the image was built with. The file is
      # moved away first: with it in place, db:migrate on an empty database
      # loads it instead of running the migrations, and the diff proves
      # nothing.
      - name: Migrations from zero match db/structure.sql
        run: >-
          docker compose run --rm -e RAILS_ENV=development api
          sh -c 'mv db/structure.sql /tmp/committed.sql
          && bin/rails db:create db:migrate
          && diff -u /tmp/committed.sql db/structure.sql'
      - name: Zeitwerk loads every file
        run: docker compose run --rm --no-deps api bin/rails zeitwerk:check
      - name: RuboCop
        run: docker compose run --rm --no-deps api bin/rubocop
      - name: Stop the containers
        if: always()
        run: docker compose down --volumes

  mac:
    name: Swift build and tests
    # macos-26 defaults to Xcode 26.6, the toolchain the package is built
    # with locally; its swift-tools-version needs Xcode 26 or later.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      # The generated Swift lists must equal a fresh run of their generator
      # over the contract (rule AR-002). -I keeps the script's folder off
      # Python's import path.
      - name: Generated contract lists are current
        working-directory: .
        run: python3 -I scripts/generate_swift_contract.py --check
      - name: Self-test of the generator
        working-directory: .
        run: python3 -I scripts/test_generate_swift_contract.py
      # The stand-in tools every Mac test runs instead of a provider's tool.
      - name: Self-test of the stand-in tools
        working-directory: .
        run: python3 -I mac/Tests/StandIns/test_provider_tool.py
      # The provider replies the detectors are tested against and the
      # stand-ins play hold no account detail: no email, token, real id or
      # unscrubbed field (plan HD-8).
      - name: Reply files hold no account detail
        working-directory: .
        run: python3 -I scripts/check_reply_fixtures.py
      - name: Self-test of the reply-file check
        working-directory: .
        run: python3 -I scripts/test_check_reply_fixtures.py
      - name: Self-test of usage reply capture
        working-directory: .
        run: python3 -I scripts/test_capture_reader_reply.py
      - name: Build
        run: swift build
      # The runner has three cores. With every test at once, the app tests
      # waited on a crowded main thread and the stand-in tools took longer to
      # start than the tests' ceilings, so the tests run one at a time and
      # wait longer for what must happen (see AGENTS.md).
      - name: Test
        env:
          LEVERAGE_TEST_PATIENCE: "4"
        run: swift test --no-parallel
      - name: Test the MCP server in its own lane
        env:
          LEVERAGE_ONLY: mcp
          LEVERAGE_TEST_PATIENCE: "4"
        run: swift test --no-parallel --scratch-path "$RUNNER_TEMP/leverage-mcp"
      # The app bundle, without the API image (that needs this job's Docker,
      # which macOS runners do not have).
      - name: Self-test of the bundle's compose file
        working-directory: .
        run: python3 -I scripts/test_app_compose.py
      - name: Build the app bundle
        working-directory: .
        run: scripts/build_app.sh --no-image
      - name: Check the bundle's Info.plist and signature
        working-directory: .
        run: |
          plutil -lint dist/Leverage.app/Contents/Info.plist
          codesign --verify --strict dist/Leverage.app

  e2e:
    name: End-to-end run with stand-in tools
    # The whole loop: the API in its containers, with the helper, runner and
    # MCP server built for Linux by the runner's Swift (the package's `e2e`
    # lane, its default on Linux). No provider is called: the tests use the
    # stand-in tools of mac/Tests/StandIns.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          swift --version
          docker --version
          docker compose version
      - name: Make the configuration
        run: python3 -I scripts/make_env.py
      - name: Build the helper, runner, MCP server and end-to-end tests
        working-directory: mac
        env:
          LEVERAGE_ONLY: e2e
        run: swift build --build-tests
      - name: Self-test of the stand-in tools
        run: python3 -I mac/Tests/StandIns/test_provider_tool.py
      - name: Self-test of the secret scan
        run: python3 -I scripts/test_secret_scan.py
      - name: Self-test of the .env generator, and the example it reads
        run: python3 -I scripts/test_make_env.py
      - name: Self-test of the end-to-end script and of these steps
        run: python3 -I scripts/test_e2e_core_loop.py
      - name: Self-test of the real Gemini check's refusals
        run: python3 -I scripts/test_real_gemini_through_app.py
      # The real rule check (milestone 4 plan §5.5) is the managing agent's
      # alone; this proves it refuses CI, a missing switch and another
      # provider, and starts nothing when it does.
      - name: Self-test of the real rule check's refusals
        run: bash scripts/test_real_rule_check.sh
      - name: Self-test of the MCP developer check
        run: bash scripts/test_real_mcp_run.sh
      - name: Self-test of the approval developer check
        run: bash scripts/test_real_approval_check.sh
      # Stand-in tools only. It builds the Swift runner lane, in a build
      # folder of its own, to run the runner's driver against them.
      - name: Self-test of the developer check with a real tool
        run: python3 -I scripts/test_real_provider_run.py
      - name: The end-to-end run
        run: scripts/e2e_core_loop.sh
      # The Handoff milestone's acceptance run: six tests, each on a compose
      # project of its own, each with a run interrupted by a limit or a
      # sign-out that the stand-ins play; the last also runs the restore
      # drill on its own log.
      - name: The handoff's end-to-end run
        run: scripts/e2e_handoff.sh
      # The Rule checks milestone's acceptance run: seven tests, each on a
      # compose project of its own from the first sign-in, which writes the
      # shipped rules; an orchestrator, a planner, a builder and reviewers
      # the helper starts on the stand-ins. After each, the replay and the
      # audit, each rule's timing, and the secret scan with the test's marker
      # words of task text, which must be in no event's payload and no log.
      - name: The rule checks' end-to-end run
        run: scripts/e2e_rule_checks.sh
      - name: The questions and approvals end-to-end run
        run: scripts/e2e_questions_approvals.sh
      - name: The credentials end-to-end run
        run: scripts/e2e_credentials.sh
      # A backup restored into a cluster whose volume was removed, from a
      # seeded log (milestone 3 plan §5.3).
      - name: The restore drill
        run: scripts/restore_drill.sh
      - name: Self-test of the speed report
        run: python3 -I scripts/test_speed_report.py
      - name: Speed smoke run
        run: scripts/speed_run.sh --smoke

  # The eval suites of "Every task needs specific details" and the
  # approval of outward actions (milestone 4 plan RV-1 to RV-6, AV-1 to
  # AV-6): the scorer's, the check's and the run script's self-tests, none
  # of which reaches a provider; then the check that the committed results
  # of both suites agree with their cases, wording, ledgers, budgets and
  # the registry lists. A missed or not-run model is printed, not failed.
  # The results are written by the maintainer's eval run, never in CI.
  evals:
    name: Eval suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test of the eval scorer
        run: python3 -I scripts/test_eval_score.py
      - name: Self-test of the eval check
        run: python3 -I scripts/test_check_evals.py
      - name: Self-test of the eval run's guards
        run: bash scripts/test_eval_rule.sh
      - name: The eval results are consistent (a missed bar is printed, not failed)
        run: python3 -I scripts/check_evals.py

  imports:
    name: Import directions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -I keeps the script's folder, which a pull request controls, off
      # Python's import path.
      - name: Check the dependency directions
        run: python3 -I scripts/check_imports.py
      - name: Self-test of the import check
        run: python3 -I scripts/test_check_imports.py
      # No tracked file names a real user's home folder (/Users/<name>,
      # /home/<name>): only the made-up names tests and docs use.
      - name: No home folder in the tree
        run: python3 -I scripts/check_home_paths.py
      - name: Self-test of the home folder check
        run: python3 -I scripts/test_check_home_paths.py
