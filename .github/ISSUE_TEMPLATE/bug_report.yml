name: Bug report
description: Something is wrong, broken, or inaccurate (including in the docs).
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Follow the
        [security policy](https://github.com/yuric/leverage/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the commit SHA, where you saw this.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Environment, logs, screenshots. Remove secrets and personal data first.
    validations:
      required: false
