# The API, its timer sweep, its daily backup and their PostgreSQL database,
# for the first run on the owner's Mac. Copy .env.example to .env first; every secret comes
# from that file. Automated runs add compose.test.yaml, which lets Docker
# pick the API's port.
name: leverage

# Every container's output: at most three files of 10 MB each. Docker's
# default keeps it without a limit, in the disk that also holds the
# database, and the sweep alone writes several lines every 15 seconds.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# What the API, the sweep and the backup share: the image, the settings and
# the two database URLs. DATABASE_URL names the owner role and is what every
# command but the server and the sweep uses; bin/docker-entrypoint puts
# API_DATABASE_URL (the login role leverage_api) in its place for those two
# when LEVERAGE_API_DB_PASSWORD is set (milestone 2 plan EN-24).
x-api: &api
  build: ./api
  image: leverage-api:${API_IMAGE_TAG:-local}
  env_file: .env
  restart: unless-stopped
  logging: *logging

x-api-environment: &api-environment
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432
  API_DATABASE_URL: ${LEVERAGE_API_DB_PASSWORD:+postgres://leverage_api:${LEVERAGE_API_DB_PASSWORD}@db:5432}
  LEVERAGE_API_DB_PASSWORD: ${LEVERAGE_API_DB_PASSWORD:-}
  # Puma's threads, and the database connections they share; a long poll
  # gives its connection back between looks (milestone 2 plan EN-21).
  RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-64}
  DB_POOL: ${DB_POOL:-32}

services:
  db:
    # The digest pins the image behind the tag (docs/adr/0002).
    image: postgres:17.12-trixie@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # The temporary server that initializes a new cluster listens only on
      # a socket. Wait for the server that will accept the API's connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    <<: *api
    environment:
      <<: *api-environment
      LEVERAGE_MCP_COMMAND: ${LEVERAGE_MCP_COMMAND:-}
    ports:
      # Loopback only: the API is not reachable from other machines.
      # API_PORT in .env moves it when 3000 is taken on the Mac.
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Rails' own health path: 200 once the app has booted.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # The timers: one pass over every workspace every 15 seconds (milestone 2
  # plan EN-22). bin/sweep --once makes one pass and exits.
  sweep:
    <<: *api
    environment: *api-environment
    command: ["bin/sweep"]
    depends_on:
      api:
        condition: service_healthy

  # The daily backup (milestone 3 plan HB-1 to HB-4): bin/backup looks when
  # it starts and every 15 minutes, and when no backup_runs row is newer
  # than BACKUP_EVERY_HOURS it dumps the database into BACKUP_DIR and keeps
  # the newest BACKUP_KEEP. It runs as the owner role: the entrypoint
  # switches roles only for the server and the sweep. The dumps go to a
  # folder on the host, outside Docker's volumes, so that losing the db
  # volume does not take them with it; LEVERAGE_BACKUP_DIR names it. The
  # maintainer's restore runs here too: bin/restore (docs/DEPLOY.md). It
  # never connects as the login role, so it is given neither that role's
  # URL nor its password (.env's value is overridden with nothing).
  backup:
    <<: *api
    environment:
      <<: *api-environment
      API_DATABASE_URL: ""
      LEVERAGE_API_DB_PASSWORD: ""
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
    command: ["bin/backup"]
    volumes:
      - ${LEVERAGE_BACKUP_DIR:-./backups}:/backups
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
